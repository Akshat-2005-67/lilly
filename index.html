<script>
const no=document.getElementById("no"),area=document.getElementById("area");
function move(){no.style.left=Math.random()*(area.clientWidth-no.offsetWidth)+"px";no.style.top=Math.random()*(area.clientHeight-no.offsetHeight)+"px";}
no.onmouseenter=move;
no.ontouchstart=e=>{e.preventDefault();move();}
function showThanks(){
  q.classList.add("hidden");
  a.classList.remove("hidden");
  const song=document.getElementById("song");
  song.play().catch(()=>{});
}
yes.onclick=e=>{e.preventDefault();showThanks();}
yes.ontouchend=e=>{e.preventDefault();showThanks();}
</script></body></html>
